<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Piste</title>
    <meta name="description" content="Score fencing bouts and run poules. Works offline." />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piste" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-tab="bout">
    <div id="app">
      <main id="view-bout" class="view"></main>
      <main id="view-poules" class="view" hidden></main>
      <main id="view-teams" class="view" hidden></main>
      <nav class="tabbar" aria-label="Main">
        <button type="button" data-tab="bout" aria-current="true">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="13.5" r="7.5" />
            <path d="M12 13.5V9.5M10 2.5h4M12 2.5V6M18.5 6.5l1.5-1.5" />
          </svg>
          <span>Bout</span>
        </button>
        <button type="button" data-tab="poules" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" />
            <path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17" />
          </svg>
          <span>Poules</span>
        </button>
        <button type="button" data-tab="teams" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="8" r="3.2" />
            <circle cx="16" cy="8" r="3.2" />
            <path d="M2.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M10.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
          </svg>
          <span>Teams</span>
        </button>
      </nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="print-root"></div>
    <noscript>Piste needs JavaScript to run.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
