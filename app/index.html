<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UCL Fencing</title>
    <meta name="description" content="UCL Fencing: score bouts and run poules, book training, and find the club." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UCL Fencing" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="book/book.css" />
  </head>
  <body data-tab="bout" data-main="fence">
    <div id="app">
      <div class="tab-stack">
        <section id="tab-fence" class="tab-view" aria-label="Fence">
          <main id="view-bout" class="view"></main>
          <main id="view-poules" class="view" hidden></main>
          <main id="view-teams" class="view" hidden></main>
        </section>
        <section id="tab-book" class="tab-view" aria-label="Book" hidden>
          <main id="book" class="view book"></main>
          <main id="view-admin" class="view" hidden></main>
        </section>
        <section id="tab-about" class="tab-view" aria-label="About" hidden>
          <main id="view-about" class="view"></main>
        </section>
      </div>
      <div class="bottom-bar">
        <div class="modebar-slot"></div>
        <nav class="tabbar" aria-label="Main"></nav>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="print-root"></div>
    <noscript>UCL Fencing needs JavaScript to run.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
